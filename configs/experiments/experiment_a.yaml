base_config: ../daily_strategy.yaml
data:
  apply_factor_direction: false
model:
  strategy_head: simple_mlp
  factor_selection:
    pooling: mean
    gate_mode_train: ste_hard
    gate_mode_eval: hard
  portfolio:
    allocation_mode: topk_equal_weight
    topk_ratio: 0.20
ablation:
  use_factor_selector: false
  use_industry_gat: false
  use_universe_gat: false
  use_direction_buffer: false
  use_directional_approximation: false
loss:
  lambda_portfolio: 0.0
  lambda_score: 1.0
  lambda_s: 0.0
  lambda_f: 0.0
  lambda_e: 0.0
logging:
  output_dir: output/daily_strategy/experiment_a
