# DISABLED AS A PAPER-REPRODUCTION DATA SOURCE: the legacy panel below is kept
# only so its absence triggers the explicit paper_repro disabled error.  It was
# removed because Top64 selection/direction used full-sample 2018-2026 IC.
# Daily strategy overrides this path with the audited train-only panel.
seed: 42
device: auto
data:
  path: /cloud/factor_synthesis/data/alphagat_64f_fixed_2018_2026_t1t2_vwap
  format: alpha_panel
  train_start: '2018-01-02'
  train_end: '2020-12-31'
  validation_start: '2021-01-04'
  validation_end: '2021-12-31'
  test_start: '2022-01-04'
  test_end: '2022-12-30'
  return_path: /cloud/E2EAI/data/alphagat_64f_2018_2026_multihorizon_paper_formula/forward_returns_3_5_10_15_20.npy
  benchmark_path: /cloud/E2EAI/data/index_universes/csi500_benchmark_paper_formula.npy
  panel_return_horizons: [3, 5, 10, 15, 20]
  label_definition: paper_formula
  label_exit_offsets: [3, 5, 10, 15, 20]
  purge_label_overlap: true
  industry_npz_path: /cloud/E2EAI/data/index_universes/industry_level1_h5_2018_2026.npz
  index_universe: csi500
  membership_path: /cloud/E2EAI/data/index_universes/csi500_membership.npz
  mmap_mode: r
model:
  num_factors: 64
  horizons: [3, 5, 10, 15, 20]
  strategy_head: e2eai
  factor_selection:
    hidden_dim: 32
    gamma_f: 0.02
    pooling: mean
    gate_mode_train: ste_hard
    gate_mode_eval: hard
    min_selected_factors: 1
  context:
    hidden_dim: 64
    normalization: cross_sectional
    dropout: 0.1
    eps: 1.0e-6
  gat:
    heads: 1
    dropout: 0.1
    leaky_relu_slope: 0.2
    add_self_loops: true
  direction:
    normalization: cross_factor_zscore
    min_stocks: 3
    eps: 1.0e-6
    zero_direction: 1
    zscore_approximation_input: false
  portfolio:
    allocation_mode: long_only_softmax
    gamma_p: 0.001
    gamma_p_mode: fixed
    theta: 0.10
    min_selected_stocks: 1
    cap_mode_train: penalty_only
    cap_mode_eval: capped_simplex
    projection_iterations: 64
loss:
  lambda_portfolio: 1.0
  lambda_s: 0.1
  lambda_f: 0.1
  lambda_e: 0.1
  lambda_up: 1.0
  lambda_score: 0.0
  eps: 1.0e-6
local_optimizer:
  lr: 0.05
  n_iter: 10
  differentiable: true
global_optimizer:
  name: AdamW
  lr: 0.001
  weight_decay: 0.0001
  scheduler: none
training:
  batch_dates: 8
  epochs: 100
  gradient_clip_norm: 5.0
  early_stopping_patience: 20
  validation_target: validation_loss
  mixed_precision: false
  shuffle_dates: false
  num_workers: 0
evaluation:
  cost_bps: 0.0
  cost_scenarios_bps: [0.0, 5.0, 10.0]
logging:
  output_dir: output/paper_index_universe_no_cap
  tensorboard: true
  wandb: false
